<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="1200" height="800" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="peach" gradientUnits="userSpaceOnUse" x1="-80" y1="-80" x2="80" y2="80">
      <stop offset="0" stop-color="#FF9A6C"/>
      <stop offset="1" stop-color="#F0553F"/>
    </linearGradient>
  </defs>

  <!-- Gear emblem -->
  <g transform="translate(300 135)">
    <g fill="url(#peach)">
      <rect x="-10" y="-82" width="20" height="22" rx="4"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(30)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(60)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(90)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(120)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(150)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(180)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(210)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(240)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(270)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(300)"/>
      <rect x="-10" y="-82" width="20" height="22" rx="4" transform="rotate(330)"/>
      <circle r="68"/>
    </g>
    <circle r="50" fill="#FFFFFF"/>
    <circle r="50" fill="none" stroke="#FFD9C2" stroke-width="3"/>

    <!-- Car silhouette -->
    <g>
      <path d="M-34 14 L-34 2 Q-34 -3 -28 -4 L-18 -7 L-9 -19 Q-7 -22 -3 -22 L16 -22 Q20 -22 23 -18 L30 -6 L33 -4 Q36 -2 36 3 L36 14 Z" fill="#2B2D33"/>
      <path d="M-5 -17 L15 -17 L22 -7 L-14 -7 Z" fill="#FFD9C2"/>
      <circle cx="-17" cy="15" r="8" fill="#2B2D33"/>
      <circle cx="-17" cy="15" r="3.5" fill="#FF9A6C"/>
      <circle cx="22" cy="15" r="8" fill="#2B2D33"/>
      <circle cx="22" cy="15" r="3.5" fill="#FF9A6C"/>
    </g>
    <!-- Leaf accent -->
    <path d="M-2 -52 Q8 -66 24 -60 Q14 -48 -2 -52 Z" fill="#3FA66B"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="285" text-anchor="middle"
        font-family="'Montserrat','Poppins','Segoe UI',Arial,sans-serif"
        font-size="68" font-weight="800" letter-spacing="1">
    <tspan fill="#2B2D33">Peach</tspan><tspan fill="#F0553F" dx="14">Cars</tspan>
  </text>

  <!-- Tagline -->
  <line x1="96" y1="327" x2="146" y2="327" stroke="#FF9A6C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="454" y1="327" x2="504" y2="327" stroke="#FF9A6C" stroke-width="2.5" stroke-linecap="round"/>
  <text x="300" y="334" text-anchor="middle"
        font-family="'Montserrat','Poppins','Segoe UI',Arial,sans-serif"
        font-size="17" font-weight="600" letter-spacing="5" fill="#555861">DRIVE YOUR DREAMS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
